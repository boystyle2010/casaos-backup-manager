name: casaos-backup-manager
services:
  backup-manager:
    image: ghcr.io/boystyle2010/casaos-backup-manager:latest
    container_name: casaos-backup-manager
    hostname: casaos-backup-manager
    restart: unless-stopped
    environment:
      BACKUP_ROOT: /DATA/Backups
      TZ: America/Denver
      # (Tùy chọn bảo mật) Bỏ dấu # nếu muốn khóa toàn bộ Web UI & API bằng Basic Auth
      # ADMIN_USER: admin
      # ADMIN_PASS: changeme_strong_password
    ports:
      - mode: ingress
        target: 8095
        published: "8095"
        protocol: tcp
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /DATA
        target: /DATA
      - type: bind
        source: /var/lib/docker/volumes
        target: /var/lib/docker/volumes
      - type: bind
        source: /DATA/AppData/casaos-backup-manager/config
        target: /root/.config/rclone
    labels:
      icon: https://raw.githubusercontent.com/boystyle2010/casaos-backup-manager/main/icon.png
    x-casaos:
      author: boystyle2010
      category: Utilities
      hostname: ""
      icon: https://raw.githubusercontent.com/boystyle2010/casaos-backup-manager/main/icon.png
      index: /
      port_map: "8095"
      scheme: http
      title:
        en: Backup Manager
        en_us: Backup Manager

networks:
  default:
    name: casaos-backup-manager_default

x-casaos:
  author: boystyle2010
  category: self
  hostname: ""
  icon: https://raw.githubusercontent.com/boystyle2010/casaos-backup-manager/main/icon.png
  index: /
  is_uncontrolled: false
  port_map: "8095"
  scheme: http
  title:
    custom: Backup Manager
