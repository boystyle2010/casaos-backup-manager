name: casaos-backup-manager
services:
  backup-manager:
    build: .
    container_name: casaos-backup-manager
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8095:8095"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /DATA:/DATA
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /DATA/AppData/casaos-backup-manager/config:/root/.config/rclone
      - /DATA/AppData/casaos-backup-manager/app:/app
    environment:
      - TZ=America/Denver
      - BACKUP_ROOT=/DATA/Backups
