<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CasaOS Backup Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0a0d12',
            darkcard: '#131720',
            darkborder: '#222834'
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    html, body {
      background-color: #e4ebf5;
    }
    html.dark, html.dark body {
      background-color: #09101f;
    }
    body {
      background-image:
        radial-gradient(ellipse 95% 230px at 50% 240px, rgba(59, 130, 246, 0.20) 0%, transparent 100%),
        radial-gradient(circle 320px at 88% 480px, rgba(139, 92, 246, 0.14) 0%, transparent 100%),
        radial-gradient(circle 320px at 12% 720px, rgba(16, 185, 129, 0.12) 0%, transparent 100%);
      background-repeat: no-repeat;
    }
    html.dark body {
      background-image:
        radial-gradient(ellipse 95% 240px at 50% 250px, rgba(37, 99, 235, 0.28) 0%, transparent 100%),
        radial-gradient(circle 340px at 88% 500px, rgba(124, 58, 237, 0.16) 0%, transparent 100%),
        radial-gradient(circle 340px at 12% 760px, rgba(16, 185, 129, 0.12) 0%, transparent 100%);
      background-repeat: no-repeat;
    }
    .bg-white.dark\:bg-darkcard {
      background-color: rgba(255, 255, 255, 0.92) !important;
      box-shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.06), inset 0 1px 0 0 rgba(255, 255, 255, 1);
    }
    html.dark .bg-white.dark\:bg-darkcard {
      background-color: rgba(17, 24, 39, 0.88) !important;
      background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.045) 0%, rgba(255, 255, 255, 0) 100%);
      box-shadow: 0 10px 28px -8px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.07);
    }
  </style>
</head>
<body class="min-h-screen bg-[#e9edf4] text-slate-900 dark:bg-darkbg dark:text-slate-100 transition-colors duration-150 pb-36"
      x-data="backupManager()" x-init="initApp()" x-cloak>

  <!-- 1. FLOATING TOAST POPUP -->
  <div x-show="toast.message"
       x-transition.opacity.duration.150ms
       class="fixed top-4 inset-x-4 max-w-md mx-auto z-50 pointer-events-auto">
    <div class="p-3.5 rounded-2xl border shadow-xl flex items-center justify-between gap-3 text-xs sm:text-sm"
         :class="toast.type === 'error'
           ? 'bg-rose-950 border-rose-600/80 text-rose-100'
           : 'bg-emerald-950 border-emerald-500/80 text-emerald-100'">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0"
             :class="toast.type === 'error' ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'">
          <svg x-show="toast.type !== 'error'" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
          </svg>
          <svg x-show="toast.type === 'error'" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008v.008H12v-.008z"/>
          </svg>
        </div>
        <span class="font-semibold break-words leading-snug" x-text="toast.message"></span>
      </div>
      <button @click="toast.message = ''" class="text-xs font-semibold opacity-80 hover:opacity-100 px-2.5 py-1 rounded-lg bg-white/10 shrink-0" x-text="t('close')"></button>
    </div>
  </div>

  <!-- 2. FLOATING UNSAVED SETTINGS BAR -->
  <div x-show="activeTab === 'settings' && isSettingsDirty() && !task.active"
       x-transition.opacity.duration.150ms
       class="fixed bottom-4 inset-x-4 max-w-xl mx-auto z-40 pointer-events-auto">
    <div class="bg-slate-900 dark:bg-[#181f2e] border border-blue-500/60 rounded-2xl p-3 shadow-2xl flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0 pl-1">
        <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shrink-0"></span>
        <span class="text-xs sm:text-sm font-semibold text-white truncate" x-text="t('unsavedNotice')"></span>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button type="button" @click="discardSettings()"
                class="h-9 px-3 rounded-xl text-xs font-semibold text-slate-300 hover:text-white bg-white/10 transition"
                x-text="t('discardBtn')">
        </button>
        <button type="button" @click="saveSettings()" :disabled="savingSettings"
                class="h-9 px-4 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-500 flex items-center gap-1.5 transition">
          <svg x-show="!savingSettings" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
          </svg>
          <svg x-show="savingSettings" class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span x-text="savingSettings ? t('processing') : t('saveSettingsBtn')"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- 3. FLOATING BACKGROUND TASK PROGRESS BAR -->
  <div x-show="task.active" class="fixed bottom-4 inset-x-4 max-w-md mx-auto z-40 pointer-events-auto">
    <div x-show="!progressMinimized"
         class="bg-white dark:bg-[#181d28] border border-blue-500/50 rounded-2xl p-4 shadow-2xl space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <svg class="w-4 h-4 text-blue-500 animate-spin shrink-0" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span class="text-xs sm:text-sm font-bold truncate" x-text="translateServerText(task.title)"></span>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button @click="cancelRunningTask()"
                  class="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-rose-500/15 text-rose-500 hover:bg-rose-500/25 border border-rose-500/30 transition"
                  x-text="t('cancelTaskBtn')">
          </button>
          <button @click="progressMinimized = true"
                  class="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition"
                  x-text="t('hideProgress')">
          </button>
        </div>
      </div>
      <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate" x-text="translateServerText(task.detail)"></p>
      <div class="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-blue-500 to-purple-500 transition-all duration-300 rounded-full"
             :style="`width: ${Math.max(task.progress || 10, 8)}%`"></div>
      </div>
    </div>

    <div x-show="progressMinimized" class="flex justify-end gap-2">
      <button @click="progressMinimized = false"
              class="bg-blue-600 text-white text-xs font-semibold px-3.5 py-2 rounded-full shadow-xl flex items-center gap-2 border border-blue-400/40 tabular-nums">
        <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span x-text="(task.progress || 10) + '%'"></span>
      </button>
    </div>
  </div>

  <!-- 4. MODAL BÁO CÁO PHIÊN SAO LƯU CHO ADMIN (Tự bật khi Admin đăng nhập lần đầu sau phiên chạy) -->
  <div x-show="reportModal.open" x-transition.opacity.duration.150ms
       class="fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-4">
    <div @click.away="acknowledgeAdminReport()"
         class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex items-start justify-between gap-3 shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-2xl flex items-center justify-center shrink-0"
               :class="data.last_report?.has_warnings ? 'bg-amber-500/15 text-amber-500' : 'bg-emerald-500/15 text-emerald-500'">
            <svg x-show="data.last_report?.has_warnings" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
            </svg>
            <svg x-show="!data.last_report?.has_warnings" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <div>
            <h3 class="text-base font-extrabold leading-tight" x-text="t('adminReportTitle')"></h3>
            <p class="text-[11px] text-slate-400 tabular-nums mt-0.5"
               x-text="(data.last_report?.timestamp || '') + (data.last_report?.trigger_type ? ' • ' + translateServerText(data.last_report.trigger_type) : '')"></p>
          </div>
        </div>
        <button @click="acknowledgeAdminReport()" class="p-1 text-slate-400 hover:text-slate-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="overflow-y-auto space-y-3.5 pr-1 flex-1">
        <!-- Phần 1: Các ứng dụng bị Bỏ qua / Quá dung lượng -->
        <template x-if="(data.last_report?.skipped?.length || 0) > 0">
          <div class="space-y-2">
            <div class="flex items-center justify-between text-xs font-bold text-amber-500">
              <span x-text="t('reportSkippedHeader') + ' (' + data.last_report.skipped.length + ')'"></span>
            </div>
            <div class="space-y-1.5">
              <template x-for="item in data.last_report.skipped" :key="item.app_name">
                <div class="p-3 rounded-2xl border text-xs space-y-1"
                     :class="item.type === 'excluded'
                       ? 'bg-slate-100/80 dark:bg-slate-900/80 border-slate-200 dark:border-slate-800 text-slate-500'
                       : 'bg-rose-500/10 border-rose-500/30 text-rose-600 dark:text-rose-300'">
                  <div class="flex items-center justify-between gap-2">
                    <span class="font-extrabold text-sm" x-text="item.app_name"></span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-md uppercase"
                          :class="item.type === 'excluded' ? 'bg-slate-500/20 text-slate-400' : 'bg-rose-500/20 text-rose-400'"
                          x-text="item.type === 'excluded' ? t('tagExcluded') : t('tagSkipped')"></span>
                  </div>
                  <p class="text-[11px] leading-snug opacity-90" x-text="translateServerText(item.reason)"></p>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Phần 2: Các ứng dụng đã Sao lưu thành công -->
        <div class="space-y-2">
          <div class="flex items-center justify-between text-xs font-bold text-emerald-600 dark:text-emerald-400">
            <span x-text="t('reportSuccessHeader') + ' (' + (data.last_report?.succeeded?.length || 0) + ')'"></span>
          </div>

          <template x-if="(data.last_report?.succeeded?.length || 0) === 0">
            <div class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-900 text-xs text-slate-400 text-center" x-text="t('noSuccessInReport')"></div>
          </template>

          <div class="space-y-1.5">
            <template x-for="okItem in (data.last_report?.succeeded || [])" :key="okItem.app_name">
              <div class="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900/90 border border-slate-200/70 dark:border-slate-800 flex items-center justify-between gap-2 text-xs">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                  <span class="font-bold text-slate-800 dark:text-slate-200 truncate" x-text="okItem.app_name"></span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0 tabular-nums">
                  <span class="text-[11px] font-bold text-blue-600 dark:text-blue-400" x-text="formatSize(okItem.size_mb)"></span>
                  <template x-if="okItem.synced_cloud">
                    <span class="inline-flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-purple-500/15 text-purple-500 border border-purple-500/25">
                      <svg class="w-2.5 h-2.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z"/>
                      </svg>
                      <span>Cloud</span>
                    </span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>

      <div class="pt-2 shrink-0">
        <button @click="acknowledgeAdminReport()"
                class="w-full h-10 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-md transition"
                x-text="t('ackReportBtn')">
        </button>
      </div>
    </div>
  </div>

  <!-- 5. MODAL PUSH / PULL CLOUD -->
  <div x-show="cloudModal.open" x-transition.opacity.duration.150ms
       class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div @click.away="cloudModal.open = false"
         class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl flex items-center justify-center"
               :class="cloudModal.mode === 'push' ? 'bg-blue-500/15 text-blue-500' : 'bg-purple-500/15 text-purple-500'">
            <svg x-show="cloudModal.mode === 'push'" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
            </svg>
            <svg x-show="cloudModal.mode === 'pull'" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9.75v6.75m0 0l-3-3m3 3l3-3m-8.25 6a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
            </svg>
          </div>
          <h3 class="text-base font-bold" x-text="cloudModal.mode === 'push' ? t('pushModalTitle') : t('pullModalTitle')"></h3>
        </div>
        <button @click="cloudModal.open = false" class="p-1 text-slate-400 hover:text-slate-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <p class="text-xs text-slate-500 dark:text-slate-400"
         x-text="cloudModal.mode === 'push' ? t('pushModalDesc') : t('pullModalDesc')"></p>

      <div x-show="cloudModal.loadingList" class="py-4 flex items-center justify-center gap-2 text-xs text-purple-400">
        <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span x-text="t('checkingCloudData')"></span>
      </div>

      <div x-show="!cloudModal.loadingList && cloudModal.availableApps.length === 0"
           class="p-3.5 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-500 text-xs text-center font-medium"
           x-text="cloudModal.mode === 'push' ? t('noSsdAppsToPush') : t('noCloudAppsToPull')">
      </div>

      <div x-show="!cloudModal.loadingList && cloudModal.availableApps.length > 0" class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400" x-text="t('selectTargetApp')"></label>
        <select x-model="cloudModal.targetApp"
                class="w-full h-11 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-3 text-xs sm:text-sm font-semibold">
          <option value="ALL" x-text="t('allAvailableOption') + ' (' + cloudModal.availableApps.length + ' apps)'"></option>
          <template x-for="name in cloudModal.availableApps" :key="name">
            <option :value="name" x-text="name"></option>
          </template>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2.5 pt-2">
        <button @click="cloudModal.open = false"
                class="h-10 rounded-xl border border-slate-200 dark:border-darkborder text-xs font-semibold"
                x-text="t('cancelBtn')">
        </button>
        <button @click="confirmCloudModal()"
                :disabled="cloudModal.loadingList || cloudModal.availableApps.length === 0"
                class="h-10 rounded-xl text-white text-xs font-bold shadow-sm disabled:opacity-40"
                :class="cloudModal.mode === 'push' ? 'bg-blue-600 hover:bg-blue-500' : 'bg-purple-600 hover:bg-purple-500'"
                x-text="cloudModal.mode === 'push' ? t('startPushBtn') : t('startPullBtn')">
        </button>
      </div>
    </div>
  </div>

  <!-- 6. MODAL CHỌN NGUỒN & PHIÊN BẢN KHÔI PHỤC -->
  <div x-show="restoreModal.open" x-transition.opacity.duration.150ms
       class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div @click.away="restoreModal.open = false"
         class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
            </svg>
          </div>
          <h3 class="text-base font-bold" x-text="t('restoreModalTitle')"></h3>
        </div>
        <button @click="restoreModal.open = false" class="p-1 text-slate-400 hover:text-slate-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="bg-slate-50 dark:bg-slate-900/75 rounded-2xl p-3.5 text-xs space-y-2.5 border border-slate-200/70 dark:border-darkborder">
        <div class="flex items-center justify-between">
          <div class="font-bold text-emerald-600 dark:text-emerald-400 text-sm truncate" x-text="restoreModal.snap?.app_name"></div>
          <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20"
                x-text="(restoreModal.versions?.length || 1) + ' ' + t('versionsCountLabel')"></span>
        </div>
        <div class="space-y-1">
          <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400" x-text="t('selectVersionLabel')"></label>
          <select x-model="restoreModal.selectedVersionId" @change="onRestoreVersionChange()"
                  class="w-full h-10 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl px-2.5 text-xs font-semibold tabular-nums">
            <template x-for="(v, idx) in restoreModal.versions" :key="v.version_id">
              <option :value="v.version_id" x-text="v.timestamp_str + ' • ' + formatSize(v.size_mb) + (idx === 0 ? (lang === 'vi' ? ' (Mới nhất)' : ' (Latest)') : '')"></option>
            </template>
          </select>
        </div>
      </div>

      <div class="space-y-2">

                @click="if(restoreModal.snap?.on_ssd) restoreModal.source = 'ssd'"
                :disabled="!restoreModal.snap?.on_ssd"

                :class="restoreModal.source === 'ssd'
                  ? 'border-blue-500 bg-blue-500/10'
                  : (restoreModal.snap?.on_ssd ? 'border-slate-200 dark:border-darkborder' : 'opacity-40 cursor-not-allowed border-slate-200 dark:border-darkborder')">

            <div class="w-8 h-8 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center">

                <rect x="3" y="3.5" width="18" height="4.5" rx="1.5"/>

              <div class="text-xs font-bold" x-text="t('sourceSsdTitle')"></div>
              <div class="text-[11px] text-slate-400" x-text="restoreModal.snap?.on_ssd ? t('sourceSsdFast') : t('notAvailableSsd')"></div>

                :disabled="!restoreModal.snap?.on_cloud"

                :class="restoreModal.source === 'cloud'
                  ? 'border-purple-500 bg-purple-500/10'
                  : (restoreModal.snap?.on_cloud ? 'border-slate-200 dark:border-darkborder' : 'opacity-40 cursor-not-allowed border-slate-200 dark:border-darkborder')">

            <div class="w-8 h-8 rounded-xl bg-purple-500/15 text-purple-500 flex items-center justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z"/>
              </svg>
            </div>
            <div>
              <div class="text-xs font-bold" x-text="t('sourceCloudTitle')"></div>
              <div class="text-[11px] text-slate-400" x-text="restoreModal.snap?.on_cloud ? t('sourceCloudDesc') : t('notAvailableCloud')"></div>
            </div>
          </div>
          <div class="w-4 h-4 rounded-full border flex items-center justify-center"
               :class="restoreModal.source === 'cloud' ? 'border-purple-500 bg-purple-500' : 'border-slate-400'">

      </div>

      <div class="grid grid-cols-2 gap-2.5 pt-2">
        <button @click="restoreModal.open = false"
                class="h-10 rounded-xl border border-slate-200 dark:border-darkborder text-xs font-semibold"
                x-text="t('cancelBtn')">
        </button>
        <button @click="confirmRestoreModal()"
                class="h-10 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-sm"
                x-text="t('confirmRestoreBtn')">

      </div>
    </div>

  <!-- 7. MODAL CHỌN NƠI XÓA -->
  <div x-show="deleteModal.open" x-transition.opacity.duration.150ms
       class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div @click.away="if(!deletingBackup) deleteModal.open = false"
         class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/>
            </svg>
          </div>
          <h3 class="text-base font-bold text-rose-500 truncate" x-text="t('deleteModalTitle')"></h3>
        </div>
        <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 truncate max-w-[140px]" x-text="deleteModal.snap?.app_name"></span>
      </div>

      <div class="space-y-1.5">
        <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400" x-text="t('selectDeleteScopeLabel')"></label>
        <select x-model="deleteModal.selectedVersionId" @change="onDeleteVersionChange()" :disabled="deletingBackup"
                class="w-full h-10 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-2.5 text-xs font-semibold tabular-nums"
                :class="deleteModal.selectedVersionId === 'ALL' ? 'text-rose-500 border-rose-500/50 bg-rose-500/5' : ''">
          <template x-if="(deleteModal.versions?.length || 0) > 1">
            <option value="ALL" x-text="'\u26A0\uFE0E ' + t('deleteAllVersionsOption') + ' (' + deleteModal.versions.length + ' ' + t('versionsCountLabel') + ' • ' + formatSize(deleteModal.totalSizeMb) + ')'"></option>
          </template>
          <template x-for="(v, idx) in deleteModal.versions" :key="v.version_id">
            <option :value="v.version_id" x-text="v.timestamp_str + ' • ' + formatSize(v.size_mb) + (idx === 0 ? (lang === 'vi' ? ' (Mới nhất)' : ' (Latest)') : '')"></option>
          </template>
        </select>
      </div>

      <div x-show="deleteModal.selectedVersionId === 'ALL' && !deletingBackup"
           class="p-3 rounded-2xl bg-rose-500/10 border border-rose-500/25 text-[11px] text-rose-500 dark:text-rose-400 font-semibold leading-snug flex items-start gap-2">
        <svg class="w-4 h-4 shrink-0 mt-0.5 text-rose-500" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
        </svg>
        <span x-text="t('deleteAllWarning')"></span>
      </div>

      <div x-show="deletingBackup" class="p-3.5 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center gap-2.5 text-xs font-semibold text-rose-500">
        <svg class="w-4 h-4 animate-spin shrink-0" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span x-text="t('deletingProgress')"></span>
      </div>

      <div class="space-y-2" x-show="!deletingBackup">
        <button x-show="deleteModal.snap?.on_ssd && deleteModal.snap?.on_cloud"
                @click="confirmDelete('both')"
                class="w-full h-10 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition shadow-sm">
          <span class="inline-flex items-center justify-center gap-1.5">
            <svg x-show="deleteModal.selectedVersionId === 'ALL'" class="w-4 h-4 shrink-0 text-current" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
            <span x-text="deleteModal.selectedVersionId === 'ALL' ? t('deleteAllBoth') : t('deleteBoth')"></span>
          </span>
        </button>
        <button x-show="deleteModal.snap?.on_ssd"
                @click="confirmDelete('ssd')"
                class="w-full h-10 rounded-xl border border-slate-200 dark:border-darkborder hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold transition">
          <span class="inline-flex items-center justify-center gap-1.5">
            <svg x-show="deleteModal.selectedVersionId === 'ALL'" class="w-4 h-4 shrink-0 text-current" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
            <span x-text="deleteModal.selectedVersionId === 'ALL' ? t('deleteAllSsdOnly') : t('deleteSsdOnly')"></span>
          </span>
        </button>
        <button x-show="deleteModal.snap?.on_cloud"
                @click="confirmDelete('cloud')"
                class="w-full h-10 rounded-xl border border-slate-200 dark:border-darkborder hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold transition">
          <span class="inline-flex items-center justify-center gap-1.5">
            <svg x-show="deleteModal.selectedVersionId === 'ALL'" class="w-4 h-4 shrink-0 text-current" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
            <span x-text="deleteModal.selectedVersionId === 'ALL' ? t('deleteAllCloudOnly') : t('deleteCloudOnly')"></span>
          </span>
        </button>
        <button @click="deleteModal.open = false"
                class="w-full h-10 rounded-xl text-xs font-semibold text-slate-400"
                x-text="t('cancelBtn')">
        </button>
      </div>
    </div>
  </div>

  <!-- ================= MAIN CONTAINER ================= -->
  <div class="relative z-10 max-w-3xl mx-auto px-3.5 sm:px-5 pt-3.5 space-y-3.5">

    <!-- TOP HEADER BAR (Giữ đúng 3 nút bên phải để không bao giờ bị chật trên iPhone; chạm vào dòng phụ đề để mở Báo cáo Admin) -->
    <header class="flex items-center justify-between gap-3 bg-white dark:bg-darkcard border border-slate-200/90 dark:border-darkborder rounded-2xl p-3.5 shadow-sm">
      <div @click="reportModal.open = true" class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer group">
        <div class="relative w-10 h-10 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-sm shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"/>
          </svg>
          <!-- Chấm báo hiệu nhỏ ngay trên góc Logo nếu có báo cáo mới hoặc có cảnh báo -->
          <span x-show="data.last_report?.unread_by_admin || data.last_report?.has_warnings"
                class="w-3 h-3 rounded-full absolute -top-1 -right-1 border-2 border-white dark:border-darkcard"
                :class="data.last_report?.has_warnings ? 'bg-amber-500 animate-pulse' : 'bg-emerald-500'"></span>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-extrabold tracking-tight truncate">Backup Manager</h1>
            <span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded-md bg-blue-500/15 text-blue-600 dark:text-blue-400 border border-blue-500/25 shrink-0">PRO</span>
          </div>
          <p class="text-[11px] truncate flex items-center gap-1"
             :class="data.last_report?.has_warnings ? 'text-amber-500 font-semibold' : 'text-slate-500 dark:text-slate-400 group-hover:text-blue-400'">
            <svg x-show="data.last_report?.report_id && data.last_report?.has_warnings" class="w-3.5 h-3.5 text-amber-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
            </svg>
            <svg x-show="data.last_report?.report_id && !data.last_report?.has_warnings" class="w-3.5 h-3.5 text-emerald-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="truncate" x-text="headerReportSummary()"></span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button @click="refreshAll()" :disabled="refreshing"
                class="w-9 h-9 rounded-xl inline-flex items-center justify-center border border-slate-200 dark:border-darkborder bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition"
                :title="t('refreshBtn')">
          <svg class="w-4 h-4 text-emerald-500" :class="refreshing ? 'animate-spin' : ''" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
          </svg>
        </button>

        <button @click="toggleLang()"
                class="h-9 px-2.5 rounded-xl text-xs font-extrabold whitespace-nowrap inline-flex items-center justify-center gap-1 border border-slate-200 dark:border-darkborder bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition">
          <svg class="w-3.5 h-3.5 text-blue-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"/>
          </svg>
          <span x-text="lang.toUpperCase()"></span>
        </button>

        <button @click="toggleTheme()"
                class="w-9 h-9 rounded-xl inline-flex items-center justify-center border border-slate-200 dark:border-darkborder bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
                :title="t('theme')">
          <svg x-show="darkMode" class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
          </svg>
          <svg x-show="!darkMode" class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- BANNER CẢNH BÁO TỰ ĐỘNG (Chỉ xuất hiện khi có Container bị bỏ qua do quá dung lượng và chưa được Admin đóng) -->
    <div x-show="data.last_report && data.last_report.has_warnings && data.last_report.unread_by_admin"
         @click="reportModal.open = true"
         class="cursor-pointer bg-amber-500/10 border border-amber-500/35 rounded-2xl p-3 flex items-center justify-between gap-3 shadow-sm">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-500 flex items-center justify-center shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
          </svg>
        </div>
        <div class="min-w-0">
          <div class="text-xs font-extrabold text-amber-600 dark:text-amber-400 truncate" x-text="t('bannerWarningTitle')"></div>
          <div class="text-[11px] text-slate-600 dark:text-slate-300 truncate" x-text="t('bannerWarningDesc')"></div>
        </div>
      </div>
      <span class="shrink-0 text-[11px] font-bold px-2.5 py-1 rounded-xl bg-amber-500 text-white" x-text="t('viewReportBtn')"></span>
    </div>

    <!-- BENTO TELEMETRY DASHBOARD -->
    <section class="space-y-3">
      <div class="grid grid-cols-3 gap-2.5">
        <!-- Card 1: Applications -->
        <div @click="activeTab = 'apps'" class="cursor-pointer bg-white dark:bg-darkcard border border-slate-200/90 dark:border-darkborder rounded-2xl p-3 flex flex-col justify-between h-[94px] shadow-sm">
          <div class="flex items-center justify-between gap-1">
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 truncate" x-text="t('statApps')"></span>
            <div class="w-6 h-6 rounded-lg bg-blue-500/15 text-blue-500 flex items-center justify-center shrink-0">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.429 9.75L2.25 12l4.179 2.25m0-4.5l5.571 3 5.571-3m-11.142 0L2.25 7.5 12 2.25l9.75 5.25-4.179 2.25m0 0L21.75 12l-4.179 2.25m0 0l4.179 2.25L12 21.75 2.25 16.5l4.179-2.25m11.142 0l-5.571 3-5.571-3"/>
              </svg>
            </div>
          </div>
          <div>
            <div class="text-2xl font-extrabold tracking-tight leading-none tabular-nums" x-text="data.containers.length"></div>
            <div class="flex items-center gap-1 mt-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span>
              <span class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 truncate tabular-nums" x-text="runningCount() + ' ' + t('running')"></span>
            </div>
          </div>
        </div>

        <!-- Card 2: Snapshots -->
        <div @click="activeTab = 'restore'" class="cursor-pointer bg-white dark:bg-darkcard border border-slate-200/90 dark:border-darkborder rounded-2xl p-3 flex flex-col justify-between h-[94px] shadow-sm">
          <div class="flex items-center justify-between gap-1">
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 truncate" x-text="t('statBackups')"></span>

              </button>
            </div>
          </div>

          return `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"/></svg>`;
        },
        runningCount() {
          return this.data.containers.filter(c => c.status === 'running').length;
        },
        formatMode(mode) {
          if (mode === 'local_cloud') return 'Local + Cloud';
          return mode || 'Local';
        },
        filteredContainers() {
          const q = (this.appSearch || '').trim().toLowerCase();
          if (!q) return this.data.containers;
          return this.data.containers.filter(c =>
            c.name.toLowerCase().includes(q) || (c.image && c.image.toLowerCase().includes(q))
          );
        },
        toggleAppDetail(id) {
          this.openDetails[id] = !this.openDetails[id];
        },
        toggleVersionList(appName) {
          this.openVersions[appName] = !this.openVersions[appName];
        },
        toggleSelectMode() {
          this.selectMode = !this.selectMode;
          this.selectedApps = [];
        },
        toggleSelectApp(name) {
          if (this.selectedApps.includes(name)) {
            this.selectedApps = this.selectedApps.filter(x => x !== name);
          } else {
            this.selectedApps.push(name);
          }
        },
        toggleSelectAllApps() {
          const visible = this.filteredContainers().map(c => c.name);
          if (this.selectedApps.length === visible.length) {
            this.selectedApps = [];
          } else {
            this.selectedApps = [...visible];
          }
        },
        async runSelectedBackups() {
          if (this.selectedApps.length === 0) return;
          const targets = [...this.selectedApps];
          this.selectMode = false;
          this.selectedApps = [];
          try {
            const res = await fetch('/api/backup-batch', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ app_names: targets })
            });
            await this.parseResponse(res);
            this.task = { active: true, title: this.t('processing'), detail: targets.join(', '), progress: 10 };
            this.startPollingTask();
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },
        get groupedBackups() {
          const list = this.filterApp === 'ALL'
            ? (this.data.backups || [])
            : (this.data.backups || []).filter(b => b.app_name === this.filterApp);
          const groups = {};
          for (const b of list) {
            if (!groups[b.app_name]) {
              groups[b.app_name] = {
                ...b,
                versions: [b],
                versions_count: 1,
                any_ssd: Boolean(b.on_ssd),
                any_cloud: Boolean(b.on_cloud)
              };
            } else {
              groups[b.app_name].versions.push(b);
              groups[b.app_name].versions_count++;
              if (b.on_ssd) groups[b.app_name].any_ssd = true;
              if (b.on_cloud) groups[b.app_name].any_cloud = true;
            }
          }
          return Object.values(groups).map(g => ({
            ...g,
            on_ssd: g.any_ssd,
            on_cloud: g.any_cloud
          }));
        },
        snapshotSettingsState() {
          const s = this.data.settings || {};
          return JSON.stringify({
            backup_mode: s.backup_mode,
            retention_count: Number(s.retention_count),
            max_app_size_gb: Number(s.max_app_size_gb || 10),
            min_free_ssd_gb: Number(s.min_free_ssd_gb || 5),
            schedule_enabled: Boolean(s.schedule_enabled),
            schedule: s.schedule,
            excluded_auto_apps: [...(s.excluded_auto_apps || [])].sort(),
            ha_schedule_enabled: Boolean(s.ha_schedule_enabled),
            ha_schedule: s.ha_schedule || '30 3 * * 0',
            ha_auto_clean: Boolean(s.ha_auto_clean),
            encryption_enabled: Boolean(s.encryption_enabled),
            encryption_password: s.encryption_password,
            rclone_remote: s.rclone_remote
          });
        },
        isSettingsDirty() {
          if (!this.originalSettingsJson) return false;
          return this.snapshotSettingsState() !== this.originalSettingsJson || this.recreateContainer !== this.savedRecreateContainer;
        },
        async discardSettings() {
          this.recreateContainer = this.savedRecreateContainer;
          await this.loadOverview(false);
        },
        showToast(msg, type = 'success') {
          this.toast = { message: this.translateServerText(msg), type };
          setTimeout(() => { this.toast.message = ''; }, 5000);
        },
        async parseResponse(res) {
          const text = await res.text();
          let json = {};
          try { json = JSON.parse(text); } catch (e) { throw new Error(text || `HTTP ${res.status}`); }
          if (!res.ok) throw new Error(json.detail || json.message || `Error ${res.status}`);
          return json;
        },
        async loadOverview(refreshCloud = false) {
          try {
            const url = refreshCloud ? '/api/overview?refresh_cloud=true' : '/api/overview';
            const res = await fetch(url);
            const out = await this.parseResponse(res);
            this.data = out;
            this.originalSettingsJson = this.snapshotSettingsState();

            // Tự động bật Popup Báo cáo cho Admin khi đăng nhập lần đầu sau phiên chạy tự động
            if (out.last_report && out.last_report.unread_by_admin && !out.task?.active) {
              this.reportModal.open = true;
            }

            if (out.task && out.task.active) {
              this.task = out.task;
              this.startPollingTask();
            }
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },
        async acknowledgeAdminReport() {
          this.reportModal.open = false;
          if (this.data.last_report) {
            this.data.last_report.unread_by_admin = false;
          }
          try {
            await fetch('/api/report/ack', { method: 'POST' });
          } catch (e) {}
        },
        startPollingTask() {
          if (this.pollTimer) clearInterval(this.pollTimer);
          this.progressMinimized = false;
          this.pollTimer = setInterval(async () => {
            try {
              const res = await fetch('/api/task-status');
              const st = await res.json();
              this.task = st;
              if (!st.active) {
                clearInterval(this.pollTimer);
                this.pollTimer = null;
                if (st.status === 'completed') {
                  this.showToast(st.title + (st.detail ? ' — ' + st.detail : ''), 'success');
                } else if (st.status === 'cancelled') {
                  this.showToast(st.title, 'error');
                } else if (st.status === 'error') {
                  this.showToast(st.detail || st.title, 'error');
                }
                await this.loadOverview(false);
              }
            } catch (e) {
              clearInterval(this.pollTimer);
              this.pollTimer = null;
            }
          }, 1000);
        },
        async cancelRunningTask() {
          try {
            await fetch('/api/task/cancel', { method: 'POST' });
            this.task.active = false;
            this.showToast(this.lang === 'vi' ? 'Đã dừng tiến trình!' : 'Task cancelled!', 'error');
            await this.loadOverview(false);
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },
        async runBackup(appName) {
          try {
            const res = await fetch(`/api/backup/${appName}`, { method: 'POST' });
            await this.parseResponse(res);
            this.task = { active: true, title: this.t('processing'), detail: appName, progress: 10 };
            this.startPollingTask();
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },
        async openCloudDialog(mode) {
          this.cloudModal.mode = mode;
          this.cloudModal.targetApp = 'ALL';
          this.cloudModal.open = true;

          if (mode === 'push') {
            this.cloudModal.loadingList = false;
            this.cloudModal.availableApps = this.data.ssd_apps || [];
          } else {
            this.cloudModal.loadingList = true;
            this.cloudModal.availableApps = this.data.cloud_apps || [];
            try {
              const res = await fetch('/api/cloud/apps');
              const out = await this.parseResponse(res);
              this.cloudModal.availableApps = out.apps || [];
            } catch (e) {
            } finally {
              this.cloudModal.loadingList = false;
            }
          }
        },
        async confirmCloudModal() {
          const mode = this.cloudModal.mode;
          const targetApp = this.cloudModal.targetApp;
          this.cloudModal.open = false;

          const endpoint = mode === 'push' ? '/api/cloud/sync-up' : '/api/cloud/pull-catalog';
          try {
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ app_name: targetApp })
            });
            await this.parseResponse(res);
            this.task = {
              active: true,
              title: mode === 'push' ? 'Cloud Push...' : 'Cloud Pull...',
              detail: targetApp,
              progress: 15
            };
            this.startPollingTask();
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },
        openRestoreDialog(groupSnap, specificVerId = null) {
          const versions = groupSnap.versions || [groupSnap];
          const chosen = (specificVerId && versions.find(v => v.version_id === specificVerId)) || versions[0];
          this.restoreModal.versions = versions;
          this.restoreModal.selectedVersionId = chosen.version_id;
          this.restoreModal.snap = chosen;
          this.restoreModal.source = chosen.on_ssd ? 'ssd' : 'cloud';
          this.restoreModal.open = true;
        },
        onRestoreVersionChange() {
          const found = (this.restoreModal.versions || []).find(v => v.version_id === this.restoreModal.selectedVersionId);
          if (found) {
            this.restoreModal.snap = found;
            if (this.restoreModal.source === 'ssd' && !found.on_ssd && found.on_cloud) {
              this.restoreModal.source = 'cloud';
            } else if (this.restoreModal.source === 'cloud' && !found.on_cloud && found.on_ssd) {
              this.restoreModal.source = 'ssd';
            }
          }
        },
        async confirmRestoreModal() {
          const snap = this.restoreModal.snap;
          const source = this.restoreModal.source;
          this.restoreModal.open = false;
          if (!snap) return;

          try {
            const res = await fetch('/api/restore', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                app_name: snap.app_name,
                version_id: snap.version_id,
                source: source,
                recreate_container: this.recreateContainer
              })
            });
            await this.parseResponse(res);
            this.task = { active: true, title: `Restore ${snap.app_name}...`, detail: `${snap.version_id} (${source.toUpperCase()})`, progress: 15 };
            this.startPollingTask();
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },
        openDeleteDialog(groupSnap, specificVerId = null) {
          const versions = groupSnap.versions || [groupSnap];
          const totalSizeMb = versions.reduce((acc, v) => acc + Number(v.size_mb || 0), 0);
          this.deleteModal.groupSnap = groupSnap;
          this.deleteModal.versions = versions;
          this.deleteModal.totalSizeMb = totalSizeMb;

          if (!specificVerId && versions.length > 1) {
            this.deleteModal.selectedVersionId = 'ALL';
            this.deleteModal.snap = {
              app_name: groupSnap.app_name,
              version_id: 'ALL',
              timestamp_str: `ALL (${versions.length})`,
              on_ssd: Boolean(groupSnap.on_ssd),
              on_cloud: Boolean(groupSnap.on_cloud)
            };
          } else {
            const chosen = (specificVerId && versions.find(v => v.version_id === specificVerId)) || versions[0];
            this.deleteModal.selectedVersionId = chosen.version_id;
            this.deleteModal.snap = chosen;
          }

          this.deletingBackup = false;
          this.deleteModal.open = true;
        },
        onDeleteVersionChange() {
          if (this.deleteModal.selectedVersionId === 'ALL') {
            const g = this.deleteModal.groupSnap;
            this.deleteModal.snap = {
              app_name: g.app_name,
              version_id: 'ALL',
              timestamp_str: `ALL (${this.deleteModal.versions.length})`,
              on_ssd: Boolean(g.on_ssd),
              on_cloud: Boolean(g.on_cloud)
            };
            return;
          }
          const found = (this.deleteModal.versions || []).find(v => v.version_id === this.deleteModal.selectedVersionId);
          if (found) {
            this.deleteModal.snap = found;
          }
        },
        async confirmDelete(target) {
          const snap = this.deleteModal.snap;
          const verId = this.deleteModal.selectedVersionId || snap?.version_id;
          if (!snap || !verId || this.deletingBackup) return;
          this.deletingBackup = true;
          this.task = {
            active: true,
            title: this.t('deletingProgress'),
            detail: verId === 'ALL'
              ? `${snap.app_name} (ALL - ${this.deleteModal.versions.length} versions)`
              : `${snap.app_name} (${snap.timestamp_str})`,
            progress: 50
          };
          try {
            const res = await fetch(`/api/backup/${snap.app_name}/${verId}?target=${target}`, { method: 'DELETE' });
            await this.parseResponse(res);
            this.deleteModal.open = false;
            this.showToast(
              verId === 'ALL'
                ? (this.lang === 'vi' ? `Đã xóa toàn bộ bản sao lưu của ${snap.app_name}!` : `Deleted all snapshots of ${snap.app_name}!`)
                : (this.lang === 'vi' ? 'Đã xóa bản sao lưu!' : 'Snapshot deleted!')
            );
            await this.loadOverview(false);
          } catch (e) {
            this.showToast(e.message, 'error');
          } finally {
            this.deletingBackup = false;
            this.task.active = false;
          }
        },
        async saveSettings() {
          if (!this.isSettingsDirty()) return;
          this.savingSettings = true;
          try {
            localStorage.setItem('cbm_recreate', this.recreateContainer);
            this.savedRecreateContainer = this.recreateContainer;
            const res = await fetch('/api/settings', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.data.settings)
            });
            await this.parseResponse(res);
            await this.loadOverview(false);
            this.showToast(this.lang === 'vi' ? 'Đã lưu thay đổi thành công!' : 'Settings saved successfully!');
          } catch (e) {
            this.showToast(e.message, 'error');
          } finally {
            this.savingSettings = false;
          }
        },
        async saveRcloneConfig() {
          try {
            const res = await fetch('/api/rclone/config', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ config_text: this.data.rclone.config_text })
            });
            await this.parseResponse(res);
            this.showToast(this.lang === 'vi' ? 'Đã lưu file rclone.conf!' : 'Saved rclone.conf!');
            this.showRcloneEditor = false;
            await this.loadOverview(true);
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },
        async copyRecoveryKey() {
          try {
            const res = await fetch('/api/recovery-key');
            const out = await this.parseResponse(res);
            await ((text) => {
              if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
              } else {
                return new Promise((resolve, reject) => {
                  const ta = document.createElement('textarea');
                  ta.value = text;
                  ta.style.position = 'fixed';
                  ta.style.left = '-9999px';
                  ta.style.top = '0';
                  document.body.appendChild(ta);
                  ta.focus();
                  ta.select();
                  try {
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    resolve();
                  } catch (e) {
                    document.body.removeChild(ta);
                    reject(e);
                  }
                });
              }
            })(out.recovery_key);
            this.showToast(this.lang === 'vi' ? 'Đã sao chép Khóa Khôi Phục vào bộ nhớ tạm! Hãy dán vào Ghi chú iPhone.' : 'Recovery Key copied to clipboard! Save it.');
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },
        async applyRecoveryKey() {
          if (!this.importKeyText.trim()) return;
          try {
            const res = await fetch('/api/recovery-key', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ recovery_key: this.importKeyText.trim() })
            });
            await this.parseResponse(res);
            this.showImportKey = false;
            this.importKeyText = '';
            this.showToast(this.lang === 'vi' ? 'Đã khôi phục kết nối Google Drive & Cài đặt thành công!' : 'Cloud connection & settings restored!');
            await this.loadOverview(true);
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        }
      }
    }
  </script>
